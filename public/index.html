<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acervo — Sistema de Biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">Aa</span>
      <div class="brand-text">
        <h1>Acervo</h1>
        <p>Controle de livros, leitores e empréstimos</p>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Seções">
      <button class="tab active" data-tab="livros" role="tab" aria-selected="true">Livros</button>
      <button class="tab" data-tab="leitores" role="tab" aria-selected="false">Leitores</button>
      <button class="tab" data-tab="emprestimos" role="tab" aria-selected="false">Empréstimos</button>
    </nav>

    <div class="status-pill" id="apiStatus">
      <span class="status-dot"></span>
      <span id="apiStatusText">Verificando conexão…</span>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Resumo do acervo"></section>

  <main>

    <section id="panel-livros" class="panel active" role="tabpanel">
      <div class="panel-head">
        <h2>Livros</h2>
        <div class="panel-actions">
          <input type="search" id="buscaLivros" placeholder="Buscar por título, autor ou ISBN" aria-label="Buscar livros">
          <button class="btn-primary" id="novoLivroBtn">Novo livro</button>
        </div>
      </div>
      <div class="catalog" id="listaLivros"></div>
      <p class="empty-state" id="emptyLivros" hidden>Nenhum livro encontrado.</p>
    </section>

    <section id="panel-leitores" class="panel" role="tabpanel">
      <div class="panel-head">
        <h2>Leitores</h2>
        <div class="panel-actions">
          <input type="search" id="buscaLeitores" placeholder="Buscar por nome ou CPF" aria-label="Buscar leitores">
          <button class="btn-primary" id="novoLeitorBtn">Novo leitor</button>
        </div>
      </div>
      <div class="catalog" id="listaLeitores"></div>
      <p class="empty-state" id="emptyLeitores" hidden>Nenhum leitor cadastrado.</p>
    </section>

    <section id="panel-emprestimos" class="panel" role="tabpanel">
      <div class="panel-head">
        <h2>Empréstimos</h2>
        <div class="panel-actions">
          <select id="filtroEmprestimos" aria-label="Filtrar empréstimos">
            <option value="todos">Todos</option>
            <option value="ativos">Ativos</option>
            <option value="finalizados">Finalizados</option>
          </select>
          <button class="btn-primary" id="novoEmprestimoBtn">Novo empréstimo</button>
        </div>
      </div>
      <div class="ledger" id="listaEmprestimos"></div>
      <p class="empty-state" id="emptyEmprestimos" hidden>Nenhum empréstimo registrado.</p>
    </section>

  </main>

  <footer class="app-footer">
    <span id="modeNote">Modo demonstração — os dados não são salvos, apenas simulam a API que você vai construir.</span>
  </footer>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
